<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1730">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FieldPilot">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>FieldPilot — Project Control</title>
<style>
:root{--navy:#0b1730;--ink:#172033;--muted:#718096;--line:#e7ebf1;--bg:#f5f7fb;--card:#fff;--blue:#248cff;--cyan:#19c4e8;--green:#19b66b;--amber:#f3a51f;--red:#e5484d;--shadow:0 8px 28px rgba(11,23,48,.07)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}
button,input,select,textarea{font:inherit}button{border:0;background:none;color:inherit}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}
header{padding:22px 18px 10px;background:linear-gradient(180deg,#f7f9fc 0,#f5f7fb 100%);position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:38px;height:38px;border-radius:11px}.brand b{font-size:17px}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.toprow{display:flex;justify-content:space-between;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;background:#dbeafe;display:grid;place-items:center;color:#174ea6;font-weight:800}
main{padding:10px 16px 24px}.hello{font-size:28px;letter-spacing:-.7px;margin:16px 0 2px}.date{color:var(--muted);font-size:14px}
.attention{margin:16px 0;padding:15px;border-radius:17px;background:#fff4df;border:1px solid #ffe0a3;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow)}.attention .dot{font-size:20px}.attention b{font-size:14px}.attention small{display:block;color:#87631c;margin-top:3px}.attention button{margin-left:auto;font-weight:800}
.section{margin-top:22px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section h2{font-size:15px;margin:0}.link{font-size:12px;color:var(--blue);font-weight:700}
.today{background:var(--navy);color:#fff;border-radius:20px;padding:17px;box-shadow:var(--shadow)}.today .muted{color:#aebbd0;font-size:12px}.today-grid{display:grid;grid-template-columns:repeat(3,1fr);margin-top:13px;gap:10px}.metric strong{font-size:22px}.metric span{display:block;color:#b9c5d7;font-size:11px;margin-top:1px}
.projects{display:grid;gap:10px}.project{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 3px 14px rgba(11,23,48,.035)}.project-top{display:flex;justify-content:space-between}.project h3{font-size:15px;margin:0}.project p{margin:3px 0 12px;color:var(--muted);font-size:12px}.pct{font-size:13px;font-weight:800}.bar{height:7px;background:#edf0f5;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:99px}.project-foot{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--muted)}.warn{color:var(--red);font-weight:700}
.priority-list,.upcoming{display:grid;gap:8px}.row{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;display:flex;align-items:center;gap:12px}.time{font-weight:800;font-size:12px;width:43px}.row-main{flex:1}.row-main b{font-size:13px}.row-main span{display:block;font-size:11px;color:var(--muted);margin-top:2px}.tag{font-size:10px;padding:5px 8px;border-radius:99px;background:#eef5ff;color:#2769b7;font-weight:700}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav{width:min(760px,100%);display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;align-items:end}.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#7b8798;padding:4px}.nav button.active{color:var(--navy);font-weight:800}.nav .plus{width:48px;height:48px;margin:-20px auto 0;border-radius:17px;background:var(--navy);color:#fff;box-shadow:0 8px 20px rgba(11,23,48,.24);font-size:25px}.icon{font-size:19px;line-height:1}
.sheet-backdrop{position:fixed;inset:0;background:rgba(6,15,30,.42);z-index:30;display:none}.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom));max-width:760px;margin:auto;max-height:85vh;overflow:auto}.grab{width:38px;height:4px;border-radius:4px;background:#d8dde6;margin:2px auto 16px}.sheet h2{margin:0 0 14px;font-size:20px}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick{background:#f5f7fb;border:1px solid #e9edf3;border-radius:15px;padding:15px 8px;text-align:center;font-weight:700;font-size:12px}.quick span{display:block;font-size:23px;margin-bottom:5px}
.form label{display:block;font-size:12px;font-weight:800;margin:12px 0 6px}.form input,.form select,.form textarea{width:100%;border:1px solid #dfe4ec;border-radius:12px;padding:12px;background:#fff;outline:none}.form textarea{min-height:80px}.primary{width:100%;padding:13px;border-radius:13px;background:var(--navy);color:#fff;font-weight:800;margin-top:16px}.ghost{width:100%;padding:12px;border-radius:13px;background:#f1f4f8;font-weight:700;margin-top:8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 15px;border-radius:12px;font-size:12px;display:none;z-index:50}
@media(min-width:600px){main{padding-left:22px;padding-right:22px}.projects{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<header><div class="toprow"><div class="brand"><img src="icons/icon-192.png"><div><b>FieldPilot</b><span>Electrical project control</span></div></div><div class="avatar">AJ</div></div></header>
<main id="main"></main>
<nav class="bottom"><div class="nav">
<button class="active" data-view="home"><span class="icon">⌂</span>Home</button>
<button data-view="day"><span class="icon">☀</span>My Day</button>
<button data-view="projects"><span class="icon">▦</span>Projects</button>
<button data-view="calendar"><span class="icon">□</span>Calendar</button>
<button class="plus" id="plus">＋</button>
</div></nav>
</div>
<div class="sheet-backdrop" id="backdrop"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const data={
projects:[
{name:"Commercial Tower",type:"Electrical Works",pct:68,days:12,overdue:2,pending:3},
{name:"Tower B",type:"MDB & Power",pct:61,days:18,overdue:0,pending:2},
{name:"Warehouse",type:"Electrical Works",pct:70,days:7,overdue:1,pending:1}],
priorities:[
["08:30","Supplier follow-up","Commercial Tower","Procurement","Ahmed / ABC Electrical"],
["10:00","MIR inspection","Tower B","Inspection","David / Consultant"],
["13:00","Site inspection","Tower B","Site activity",""],
["15:30","Arrange vehicle","Warehouse → Site","Logistics","Hassan / Transport"]],
upcoming:[["Tomorrow","Cable delivery","Commercial Tower"],["28 Sep","MDB inspection","Tower B"],["02 Oct","Project milestone","Commercial Tower"]]
};
const main=document.getElementById("main"), backdrop=document.getElementById("backdrop"), sheet=document.getElementById("sheet"), toast=document.getElementById("toast");
function home(){main.innerHTML=`
<div class="hello">Good evening, Ameena</div><div class="date">Saturday, 26 September</div>
<div class="attention"><div class="dot">⚠️</div><div><b>4 things need your attention</b><small>2 overdue tasks · 1 delivery due tomorrow · 1 MIR pending</small></div><button onclick="showAttention()">›</button></div>
<div class="section"><div class="section-head"><h2>TODAY</h2><span class="link">My Day</span></div><div class="today"><div class="muted">YOUR WORKLOAD</div><div class="today-grid"><div class="metric"><strong>7</strong><span>tasks</span></div><div class="metric"><strong>2</strong><span>site activities</span></div><div class="metric"><strong>1</strong><span>delivery</span></div></div></div></div>
<div class="section"><div class="section-head"><h2>MY PROJECTS</h2><span class="link" onclick="setView('projects')">View all</span></div><div class="projects">${data.projects.map(p=>`<div class="project"><div class="project-top"><div><h3>${p.name}</h3><p>${p.type}</p></div><div class="pct">${p.pct}%</div></div><div class="bar"><i style="width:${p.pct}%"></i></div><div class="project-foot"><span>${p.days} days left</span><span class="${p.overdue?'warn':''}">${p.overdue?'⚠ '+p.overdue+' overdue':'✓ On track'} · ${p.pending} pending</span></div></div>`).join("")}</div></div>
<div class="section"><div class="section-head"><h2>TODAY'S PRIORITIES</h2></div><div class="priority-list">${data.priorities.map(x=>`<div class="row"><div class="time">${x[0]}</div><div class="row-main"><b>${x[1]}</b><span>${x[2]}${x[4]?' · '+x[4]:''}</span></div><span class="tag">${x[3]}</span></div>`).join("")}</div></div>
<div class="section"><div class="section-head"><h2>UPCOMING</h2></div><div class="upcoming">${data.upcoming.map(x=>`<div class="row"><div class="time" style="width:60px">${x[0]}</div><div class="row-main"><b>${x[1]}</b><span>${x[2]}</span></div></div>`).join("")}</div></div>`}
function day(){main.innerHTML=`<div class="hello">My Day</div><div class="date">Saturday, 26 September</div><div class="section"><div class="today"><div class="muted">TODAY</div><div style="font-size:26px;font-weight:800;margin-top:4px">7 tasks</div><div class="muted">3 completed · 2 in progress · 2 pending</div></div></div><div class="section"><div class="priority-list">${data.priorities.concat([["17:00","Update project progress","Commercial Tower","Project",""]]).map((x,i)=>`<div class="row" onclick="toastMsg('${i<3?'Task opened':'Activity opened'}')"><div class="time">${x[0]}</div><div class="row-main"><b>${x[1]}</b><span>${x[2]}${x[4]?' · '+x[4]:''}</span></div><span class="tag">${x[3]}</span></div>`).join("")}</div></div>`}
function projects(){main.innerHTML=`<div class="hello">Projects</div><div class="date">3 active projects</div><div class="section"><div class="projects">${data.projects.map(p=>`<div class="project" onclick="toastMsg('${p.name} opened')"><div class="project-top"><div><h3>${p.name}</h3><p>${p.type}</p></div><div class="pct">${p.pct}%</div></div><div class="bar"><i style="width:${p.pct}%"></i></div><div class="project-foot"><span>${p.days} days left</span><span class="${p.overdue?'warn':''}">${p.overdue?'⚠ '+p.overdue+' overdue':'✓ On track'} · ${p.pending} pending</span></div></div>`).join("")}</div></div>`}
function calendar(){main.innerHTML=`<div class="hello">Calendar</div><div class="date">Agenda · upcoming workload</div><div class="section">${[["SAT 26",data.priorities],["MON 28",[["09:00","Cable delivery","Commercial Tower","Delivery","ABC Electrical"],["14:00","Project meeting","Tower B","Meeting",""]]],["FRI 02",[[ "10:00","Project milestone","Commercial Tower","Milestone",""]]]].map(d=>`<div style="margin:18px 0 9px;font-size:12px;font-weight:900;color:#718096">${d[0]}</div>${d[1].map(x=>`<div class="row" style="margin-bottom:8px"><div class="time">${x[0]}</div><div class="row-main"><b>${x[1]}</b><span>${x[2]}${x[4]?' · '+x[4]:''}</span></div><span class="tag">${x[3]}</span></div>`).join("")}`).join("")}</div>`}
function setView(v){document.querySelectorAll(".nav button[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===v));({home,day,projects,calendar}[v]||home)()}
document.querySelectorAll(".nav button[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view));
document.getElementById("plus").onclick=()=>openSheet();
function openSheet(){sheet.innerHTML=`<div class="grab"></div><h2>What do you want to add?</h2><div class="quick-grid">${[["✓","Task"],["▣","Material"],["⌁","Procurement"],["▤","Delivery"],["◫","MIR"],["₹","Payment"],["▰","Vehicle / Logistics"],["◆","Milestone"],["✎","Note"],["●","Contact"]].map(x=>`<button class="quick" onclick="quick('${x[1]}')"><span>${x[0]}</span>${x[1]}</button>`).join("")}</div>`;backdrop.style.display="block"}
function quick(type){if(type==="Task"){sheet.innerHTML=`<div class="grab"></div><h2>New Task</h2><div class="form"><label>What needs to be done?</label><input id="taskName" placeholder="e.g. Follow up cable delivery"><label>Project</label><select><option>Commercial Tower</option><option>Tower B</option><option>Warehouse</option></select><label>Due</label><select><option>Today</option><option>Tomorrow</option><option>28 Sep</option></select><label>Priority</label><select><option>Medium</option><option>High</option><option>Low</option></select><label>Dealing With <span style="font-weight:400;color:#718096">(optional)</span></label><input placeholder="Search person or company"><button class="primary" onclick="saveTask()">Add Task</button></div>`}else if(type==="Contact"){sheet.innerHTML=`<div class="grab"></div><h2>Add Person</h2><div class="form"><label>Name</label><input placeholder="Ahmed"><label>Company</label><input placeholder="ABC Electrical"><label>Role</label><input placeholder="Sales Engineer"><label>Phone</label><input placeholder="+971..."><label>Type</label><select><option>Supplier</option><option>Client</option><option>Consultant</option><option>Contractor</option><option>Internal</option><option>Driver</option></select><button class="primary" onclick="closeSheet();toastMsg('Person saved')">Save</button></div>`}else{sheet.innerHTML=`<div class="grab"></div><h2>New ${type}</h2><div class="form"><label>Name / Description</label><input placeholder="${type}"><label>Project</label><select><option>Commercial Tower</option><option>Tower B</option><option>Warehouse</option></select><label>Dealing With</label><input placeholder="Search person or company"><label>Next Action</label><input placeholder="What happens next?"><label>Follow Up On</label><input type="date"><button class="primary" onclick="closeSheet();toastMsg('${type} saved')">Save</button></div>`}}
function saveTask(){closeSheet();toastMsg("Task added to My Day")}
function closeSheet(){backdrop.style.display="none"}
backdrop.onclick=e=>{if(e.target===backdrop)closeSheet()}
function toastMsg(s){toast.textContent=s;toast.style.display="block";setTimeout(()=>toast.style.display="none",1800)}
function showAttention(){toastMsg("Attention center opened")}
home();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
